[package]
name = "dotagents"
version = "0.1.0"
edition = "2021"
description = "Universal compiler and syncer for AI coding agent rules, skills, and MCP configs (Claude Code, Codex, Antigravity/Gemini, Cursor, Copilot)."
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai", "agents", "mcp", "claude", "cursor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.13"
