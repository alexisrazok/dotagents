name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          BIN_NAME=$(grep '^name =' Cargo.toml | tail -n1 | cut -d'"' -f2)
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${BIN_NAME}"
          tar -czf "${BIN_NAME}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C dist "${BIN_NAME}"
      - name: Package artifact (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bin = (Select-String -Path Cargo.toml -Pattern '^name = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${bin}.exe" "dist\${bin}.exe"
          Compress-Archive -Path "dist\${bin}.exe" -DestinationPath "${bin}-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
